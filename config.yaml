# ─── Channel ───────────────────────────────────────────────────────────────
topic: "GTA 6"                       # what the channel is about
news_queries: ["GTA 6", "GTA VI", "Grand Theft Auto VI"]
# Voice: "edge" = Microsoft neural voices (most natural, free, no key; unofficial
# endpoint, so it falls back to the local Kokoro voice automatically if it fails).
engine: edge
edge_voice: en-US-AndrewMultilingualNeural   # also great: en-US-BrianMultilingualNeural, en-US-AvaMultilingualNeural
edge_rate: "+8%"
voice: am_michael                    # Kokoro fallback voice
voice_speed: 1.05
music_gain: 0.32

# ─── Topic focus ───────────────────────────────────────────────────────────
# Until this date most videos are about the focus topic; after it, the daily writer
# follows what's trending (Google Trends + YouTube trending, filtered for a broad audience).
focus:
  topic: "GTA 6"
  topic_key: gta6        # footage/gta6/ clips are used as backgrounds for these videos
  until: "2026-11-23"    # GTA week ended early: owner asked for a broader mix
  share: 0.0             # share of videos on the focus topic while it's active

# Posting schedule: 3 posts a day, each at a random time inside its window (new times every day).
# Hourly runs check whether a window's time is coming up and wait for it. Queue files with "post_at"
# (e.g. 3D explainers) go out at exactly that time. Nothing regular posts before pause_until (UTC).
schedule:
  timezone: America/Chicago
  windows: [["11:00", "12:45"], ["16:00", "17:45"], ["19:00", "21:00"]]
  # Recovery mode: from Nov 26, just 1 post a day at a random time between 4 and 9 PM.
  # Go back up to 2, then 3 windows once Shorts-feed views return.
  windows_from:
    "2026-11-26": [["16:00", "21:00"]]
  pause_until: "2026-11-25T23:00Z"
  lookahead_min: 65
# Safety net against double posts from overlapping timers.
min_gap_minutes: 100

# ─── Format rotation ──────────────────────────────────────────────────────
# Relative weights. A format is never repeated back-to-back, and the last
# 2 formats are avoided when possible. Clip/footage formats only run when
# sources exist (see below), otherwise they're skipped automatically.
formats:
  stat_shock: 3      # one jaw-dropping number, counted up + context
  top_list: 3        # "3 things you missed", countdown #3 → #1
  versus: 2          # GTA V vs GTA VI style comparison table
  quiz: 2            # timed quiz, drives comments
  myth_or_fact: 2    # "TRUE or FALSE?" debunks
  news_flash: 3      # today's biggest headline in 20s
  clip_react: 2      # streamer clip + hook title + captions (allowlist only!)
  gameplay_story: 2  # narration over YOUR OWN gameplay footage in footage/
  stickman: 3        # animated stickman skits that act out the topic
  footage_story: 0   # videos about one gameplay clip; written by the daily writer (1 in 5), not picked here
  top5_streamer: 2   # "Top 5 <streamer> moments" compilation (allowlist only!)

compilation:
  count: 3              # 3 clips (~30 s) holds viewers better than 5 (~55 s)
  target_seconds: 30
  lookback_days: 7

# ─── LLM (optional) ───────────────────────────────────────────────────────
# With no key, videos come from live news headlines + the fact-checked scripts
# in bank/ (accurate, no AI). Add a GEMINI_API_KEY or GROQ_API_KEY secret to
# let a strong AI write fresh scripts. The small local model (ollama) wrote
# inaccurate scripts in testing, so it's off; add "ollama" here to try it.
llm:
  providers: [gemini, groq]
  gemini_model: gemini-flash-latest
  groq_model: llama-3.3-70b-versatile
  ollama_model: qwen2.5:3b

# ─── Clips: ONLY creators who allow reuploads of their clips ──────────────
# Reposting someone's stream without permission gets copyright strikes
# (3 strikes = channel deleted). Add a streamer only if they run a clipping
# program / publicly allow clip channels, and set permission: true.
twitch_clips:
  game_name: "Grand Theft Auto VI"
  lookback_hours: 48
  min_views: 500
  streamers:
    - login: kaicenat
      permission: true
      note: "owner confirmed Kai Cenat allows clipping (2026-11-23)"
    - login: xqc
      permission: true
      note: "owner confirmed xQc allows clipping (2026-11-23)"
    # IShowSpeed, Nick Eh 30, Typical Gamer and MrBeast are allowed too (owner confirmed),
    # but as far as we know they publish mainly on YouTube, which this Twitch-only clip source can't pull from.

# ─── Your own gameplay recordings (mp4) for gameplay_story ────────────────
footage_dir: footage

# ─── Publishing ───────────────────────────────────────────────────────────
platforms:
  youtube: true
  tiktok: false      # off until TikTok approves the app (see SETUP.md)
  instagram: false     # turn on after finishing Instagram setup in SETUP.md
privacy: public        # public | unlisted | private (use private for a test week)
label_ai_content: true # sets TikTok is_aigc / Instagram AI label; YouTube flag only for realistic content
youtube_category: "20" # Gaming
dry_run: false         # true = render only, never upload
