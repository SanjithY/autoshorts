# Verified facts the script writer can always draw on (add your own!).
# Keep each fact short and include where it came from.
facts:
  - fact: "GTA 6 launched November 19, 2026 on PS5 and Xbox Series X|S."
    source: "Variety / GameSpot"
  - fact: "Standard edition $79.99, ultimate edition $99.99."
    source: "Variety"
  - fact: "Preorders opened June 25, 2026."
    source: "Variety"
  - fact: "Take-Two says GTA 6 preorder + first-day sales reached $3.79 billion, calling it the biggest entertainment launch in history."
    source: "Take-Two via Variety, Nov 20 2026"
  - fact: "Sensor Tower estimated about 19.05 million copies and $1.84B by the morning of launch, with about 75% of sales on PlayStation (third-party estimate, not official)."
    source: "Sensor Tower via esports.gg / 80.lv"
  - fact: "GTA V sold 11.21 million copies and about $815M in its first 24 hours (2013)."
    source: "gtaintel / Guinness figures"
  - fact: "GTA IV sold about 3.6 million copies and $310M on day one (2008)."
    source: "GameSpot"
  - fact: "Before GTA V, the day-one record was Call of Duty: Black Ops II at $500 million."
    source: "FOX 5"
  - fact: "GTA 6 brings back a six-star wanted level; GTA V maxed out at five. Six stars last appeared in GTA IV and Chinatown Wars."
    source: "Shacknews, GTABase"
  - fact: "GTA 6 police track you by face, clothing, vehicle and CCTV footage, shown as icons under the wanted stars."
    source: "GamesRadar, Beebom"
  - fact: "PC Gamer only reached six stars by stealing a tank from a military base and blowing up other vehicles."
    source: "PC Gamer"
  - fact: "The two protagonists are Jason and Lucia; the game is set in the state of Leonida, including Vice City."
    source: "Rockstar"
  - fact: "Players found 44 easter eggs in Leonida within the first hours, including a possible Michael De Santa boat reference."
    source: "Quero Bolsa, VGTimes"
  - fact: "GTA V launched in 2013 at $59.99 and had three playable leads (Michael, Franklin, Trevor)."
    source: "Rockstar"
