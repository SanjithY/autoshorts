name: autopost

on:
  schedule:
    - cron: "15 1-22/3 * * *"   # every 3 hours = 1:15, 4:15, 7:15, 10:15 AM/PM US Central
    - cron: "40 1-22/3 * * *"   # retry 25 min later in case GitHub drops the first; min_gap_minutes prevents double posts
  workflow_dispatch:          # "Run workflow" button for manual tests
    inputs:
      dry_run:
        description: "Render only, don't upload"
        type: boolean
        default: false
      format:
        description: "Force a format (optional)"
        required: false
      force:
        description: "Post even if the last post was recent"
        type: boolean
        default: false
      artifact_run_id:
        description: "Upload the exact video from this past run's artifact instead of making a new one"
        required: false

permissions:
  contents: write   # lets the run save state/history.json back to the repo
  actions: read     # lets a run download a past run's video artifact

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libfontconfig1

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download voice model (first run only)
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f models/voices.bin ] || curl -sL -o models/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Get gameplay/B-roll footage (from the "footage" release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p footage
          gh release download footage --repo "$GITHUB_REPOSITORY" --dir footage/_release --clobber 2>/dev/null || echo "no footage release yet"
          # files named like gta6__police_chase.mp4 go into footage/gta6/police_chase.mp4
          for f in footage/_release/*; do [ -f "$f" ] || continue; b=$(basename "$f"); t="${b%%__*}"; n="${b#*__}"
            if [ "$t" != "$b" ]; then mkdir -p "footage/$t"; mv "$f" "footage/$t/$n"; fi; done

      - name: Fetch a past run's video (when artifact_run_id is set)
        if: ${{ inputs.artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
          path: prebuilt/

      - name: Make, render and publish one video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          ARGS=""
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ -n "${{ inputs.format }}" ] && ARGS="$ARGS --format ${{ inputs.format }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          [ -n "${{ inputs.artifact_run_id }}" ] && ARGS="$ARGS --prebuilt prebuilt"
          python run.py $ARGS

      - name: Keep the video as a downloadable artifact (7 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/
          retention-days: 7

      - name: Save history + rotated tokens
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state/ queue/
          git diff --cached --quiet && exit 0
          git commit -m "autopost: update history [skip ci]"
          for i in 1 2 3; do git pull --rebase --autostash -q && git push -q && break; sleep 5; done
