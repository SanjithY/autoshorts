name: render3d

# Renders a premium 3D explainer (Blender) from explainers/<name>.json, stores the finished video in prebuilt/,
# and queues it to post at the given time (the regular autopost run uploads it as-is).
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Explainer script, e.g. explainers/pin-tumbler-lock.json"
        required: true
      post_at:
        description: "Exact time to post (UTC, YYYY-MM-DDTHH:MM), e.g. 5:00 PM Central = 23:00 UTC"
        required: true

permissions:
  contents: write

concurrency:
  group: render3d
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libegl1 libgl1 libgl1-mesa-dri libegl-mesa0 libfontconfig1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6

      - name: Install Python packages (incl. Blender as a module)
        run: pip install -r requirements.txt bpy

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0-int8

      - name: Download voice model (first run only)
        run: |
          mkdir -p models
          [ -f models/kokoro.onnx ] || curl -sL -o models/kokoro.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          [ -f models/voices.bin ] || curl -sL -o models/voices.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Render (Blender frames -> captions, SFX, music -> mp4)
        run: python -m pipeline.render.x3d.render "${{ inputs.script }}" out3d.mp4 x3d_work

      - name: Keep the video as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: explainer3d
          path: out3d.mp4
          retention-days: 14

      - name: Store the video and queue it
        env:
          SCRIPT: ${{ inputs.script }}
          POST_AT: ${{ inputs.post_at }}
        run: |
          slug=$(basename "$SCRIPT" .json)
          mkdir -p prebuilt
          cp out3d.mp4 "prebuilt/$slug.mp4"
          python - <<'PY'
          import json, os
          slug = os.path.basename(os.environ["SCRIPT"])[:-5]
          d = json.load(open(os.environ["SCRIPT"]))
          meta = {k: d[k] for k in ("title", "description", "hashtags") if k in d}
          meta.update({"format": "explainer3d", "prebuilt_asset": f"{slug}.mp4", "post_at": os.environ["POST_AT"], "post_after": os.environ["POST_AT"]})
          # "0-" sorts before dated queue files, so it's the first thing posted once its time comes
          json.dump(meta, open(f"queue/0-x3d-{slug}.json", "w"), indent=1)
          PY
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add prebuilt queue
          git commit -m "3D explainer rendered: $slug (posts $POST_AT UTC)"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done
